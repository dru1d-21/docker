name: CI/CD

on:
  push:
    branches: [main]

jobs:
  # ── Job 1: Build image and run tests on GitHub-hosted runner ──────────────
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kubsu
          POSTGRES_PASSWORD: kubsu
          POSTGRES_DB: kubsu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --target production -t kubsu-app:latest .

      - name: Build test image
        run: docker build --target test -t kubsu-app:test .

      - name: Run tests inside test image
        run: |
          docker run --rm \
            --network host \
            -e DATABASE_URL=postgresql+psycopg://kubsu:kubsu@127.0.0.1:5432/kubsu \
            kubsu-app:test \
            pytest tests -v

      - name: Export production image
        run: docker save kubsu-app:latest | gzip > kubsu-app.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: kubsu-app.tar.gz
          retention-days: 1

  # ── Job 2: Deploy via self-hosted runner on your laptop ───────────────────
  deploy:
    needs: build-and-test
    runs-on: self-hosted

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Stream image directly to server
        run: ssh -p 58529 -T -o StrictHostKeyChecking=no -o BatchMode=yes feynman@kubsu.tyvik.ru 'podman load' < kubsu-app.tar.gz

      - name: Restart container on server
        run: |
          ssh -p 58529 -T -o StrictHostKeyChecking=no -o BatchMode=yes feynman@kubsu.tyvik.ru \
            'podman stop kubsu-app 2>/dev/null; podman rm kubsu-app 2>/dev/null; podman run -d --name kubsu-app --network host -e DATABASE_URL=postgresql+psycopg://kubsu:kubsu@db:5432/kubsu kubsu-app:latest'
