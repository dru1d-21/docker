name: CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/docker

jobs:
  # ── Job 1: тесты + push в GHCR ────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t kubsu-app:test .

      - name: Run tests with docker compose
        run: docker compose run --rm test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        run: |
          docker build --target runtime \
            -t ${{ env.IMAGE }}:latest \
            -t ${{ env.IMAGE }}:${{ github.sha }} .
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ github.sha }}

  # ── Job 2: деплой через self-hosted runner (ноутбук → сервер) ─────────────
  deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Deploy on server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE: ${{ env.IMAGE }}:latest
        run: |
          ssh -p 58529 -o StrictHostKeyChecking=no feynman@kubsu.tyvik.ru bash -s << EOF
          set -e
          echo "$GHCR_TOKEN" | podman login ghcr.io -u "$GH_ACTOR" --password-stdin
          podman pull "$IMAGE"
          podman stop kubsu-app 2>/dev/null || true
          podman rm   kubsu-app 2>/dev/null || true
          podman run -d --name kubsu-app --network host \
            -e DATABASE_URL=postgresql+psycopg://kubsu:kubsu@127.0.0.1:5432/kubsu \
            "$IMAGE"
          EOF
