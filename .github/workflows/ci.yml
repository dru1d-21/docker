name: CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # ── Job 1: сборка, тесты, push production образа в GHCR ───────────────────
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kubsu
          POSTGRES_PASSWORD: kubsu
          POSTGRES_DB: kubsu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image name (lowercase for GHCR)
        id: meta
        run: |
          REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build test image
        run: docker build --target test -t kubsu-app:test .

      - name: Run tests inside test image
        run: |
          docker run --rm \
            --network host \
            -e DATABASE_URL=postgresql+psycopg://kubsu:kubsu@127.0.0.1:5432/kubsu \
            kubsu-app:test \
            pytest tests -v

      - name: Build and push production image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.image }}

  # ── Job 2: деплой на сервер через SSH ─────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf 'Host kubsu.tyvik.ru\n  Port 58529\n  User feynman\n  IdentityFile ~/.ssh/id_ed25519\n  StrictHostKeyChecking no\n' > ~/.ssh/config

      - name: Deploy on server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE: ${{ needs.build-and-test.outputs.image }}
        run: |
          ssh kubsu.tyvik.ru bash << EOF
          set -e
          echo "$GH_TOKEN" | podman login ghcr.io -u "$GH_ACTOR" --password-stdin
          podman pull "$IMAGE"
          podman stop kubsu-app 2>/dev/null || true
          podman rm   kubsu-app 2>/dev/null || true
          podman run -d \
            --name kubsu-app \
            --network host \
            -e DATABASE_URL=postgresql+psycopg://kubsu:kubsu@db:5432/kubsu \
            "$IMAGE"
          EOF
