name: CI/CD

on:
  push:
    branches: [main]

jobs:
  # ── Job 1: Build, test, push to GHCR ──────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kubsu
          POSTGRES_PASSWORD: kubsu
          POSTGRES_DB: kubsu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build production image
        run: docker build --target production -t ghcr.io/${{ github.repository }}:latest .

      - name: Build test image
        run: docker build --target test -t kubsu-app:test .

      - name: Run tests inside test image
        run: |
          docker run --rm \
            --network host \
            -e DATABASE_URL=postgresql+psycopg://kubsu:kubsu@127.0.0.1:5432/kubsu \
            kubsu-app:test \
            pytest tests -v

      - name: Push production image to GHCR
        run: docker push ghcr.io/${{ github.repository }}:latest

  # ── Job 2: Pull from GHCR, stream to server ───────────────────────────────
  deploy:
    needs: build-and-test
    runs-on: self-hosted
    permissions:
      packages: read

    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image from GHCR
        run: docker pull ghcr.io/${{ github.repository }}:latest

      - name: Stream image to server
        run: docker save ghcr.io/${{ github.repository }}:latest | gzip | ssh -p 58529 -T -o StrictHostKeyChecking=no -o BatchMode=yes feynman@kubsu.tyvik.ru 'podman load'

      - name: Restart container on server
        run: |
          ssh -p 58529 -T -o StrictHostKeyChecking=no -o BatchMode=yes feynman@kubsu.tyvik.ru \
            'podman stop kubsu-app 2>/dev/null; podman rm kubsu-app 2>/dev/null; podman run -d --name kubsu-app --network host -e DATABASE_URL=postgresql+psycopg://kubsu:kubsu@db:5432/kubsu ghcr.io/${{ github.repository }}:latest'
